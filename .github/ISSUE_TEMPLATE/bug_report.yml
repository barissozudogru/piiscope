name: Bug Report
description: Create a report to help us improve piiscope
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: piiscope Version
      description: What version of piiscope are you using?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Environment
      description: What OS and Python version are you using?
