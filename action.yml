name: piiscope privacy scan
description: Scan files for personal data and emit a secret-safe SARIF artifact.
author: Petri Labs

branding:
  icon: shield
  color: green

inputs:
  path:
    description: File or directory to scan.
    required: true
  fail-on:
    description: Risk level that fails the action.
    required: false
    default: high
  sarif-file:
    description: Path for the SARIF result.
    required: false
    default: piiscope.sarif

outputs:
  sarif-file:
    description: Path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install piiscope
      shell: bash
      run: python -m pip install "piiscope==1.3.0"
    - id: scan
      name: Scan for personal data
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e
        piiscope scan "$INPUT_PATH" --format sarif --output "$INPUT_SARIF_FILE" --fail-on "$INPUT_FAIL_ON"
        status=$?
        set -e

        echo "sarif-file=$INPUT_SARIF_FILE" >> "$GITHUB_OUTPUT"
        {
          echo "## piiscope privacy scan"
          echo
          echo "SARIF written to \`$INPUT_SARIF_FILE\`. Matched values are not included in the artifact."
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$status"
